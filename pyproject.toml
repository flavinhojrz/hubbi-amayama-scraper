[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amayama-scraper"
version = "0.1.0"
description = "Amayama Volkswagen Amarok (AMA-BR) ingestion pipeline — MVP domain core."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<6",
    "selenium>=4.15,<5",
    "undetected-chromedriver>=3.5,<4",
    "requests>=2.31,<3",
    # undetected-chromedriver 3.5.x ainda importa `distutils` (removido da
    # stdlib no Python 3.12+) — setuptools>=60 reinstala um `distutils` via
    # shim assim que é importado primeiro (ver import em
    # transport/undetected_chrome_adapter.py). Sem relação com nada de
    # build/empacotamento deste projeto.
    "setuptools>=60",
    "pyautogui>=0.9.54",
    "opencv-python>=4.10,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/amayama_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "unit: pure unit tests, no I/O",
    "integration: integration tests, may touch filesystem/sqlite",
    "parser: parser fixture tests",
    "regression: regression tests over known evidence pairs",
]

[tool.coverage.run]
source = ["src/amayama_scraper"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
